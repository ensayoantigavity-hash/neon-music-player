<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NEON MUSIC · Radio</title>
  <style>
    :root { --neon: #19e3ff; --neon2: #ff2bd6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 800px at 50% -10%, #16213a 0%, #0a0e1a 55%, #05070f 100%);
      color: #eaf2ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; padding: 20px; text-align: center; overflow: hidden;
    }
    .card {
      width: min(520px, 92vw); padding: 28px 22px; border-radius: 20px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(25,227,255,0.25);
      box-shadow: 0 0 40px rgba(25,227,255,0.12), inset 0 0 30px rgba(255,43,214,0.05);
      backdrop-filter: blur(6px);
    }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px;
      background: linear-gradient(90deg, var(--neon), var(--neon2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .station { font-size: 13px; color: #9fb6d4; text-transform: uppercase; letter-spacing: 2px; margin: 10px 0 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #44506a; box-shadow: 0 0 8px rgba(0,0,0,0.4); }
    .dot.on { background: #25e08a; box-shadow: 0 0 10px rgba(37,224,138,0.8); }
    .dot.off { background: #ff5d5d; box-shadow: 0 0 10px rgba(255,93,93,0.8); }
    .vinyl {
      width: 190px; height: 190px; border-radius: 50%; margin: 0 auto 16px;
      background: #0c1322; box-shadow: 0 0 36px rgba(25,227,255,0.28);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 3px solid rgba(25,227,255,0.35);
    }
    .vinyl.playing { animation: spin 7s linear infinite; }
    .vinyl img { width: 100%; height: 100%; object-fit: cover; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: 700; line-height: 1.25; margin: 0 0 4px; }
    .artist { font-size: 14px; color: #9fb6d4; margin: 0 0 22px; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 6px 0 10px; }
    .play {
      width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px;
      color: #04121c; background: linear-gradient(90deg, var(--neon), var(--neon2));
      box-shadow: 0 0 24px rgba(25,227,255,0.45); display: flex; align-items: center; justify-content: center;
    }
    .play:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
    .play:active { transform: scale(0.96); }
    .vol-wrap { display: flex; align-items: center; gap: 8px; }
    .vol-icon { font-size: 18px; filter: drop-shadow(0 0 6px rgba(25,227,255,0.5)); }
    .vol { width: 140px; height: 6px; border-radius: 6px; -webkit-appearance: none; appearance: none;
      background: linear-gradient(90deg, var(--neon) var(--pct, 80%), #2a3550 var(--pct, 80%)); outline: none; cursor: pointer; }
    .vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); cursor: pointer; }
    .vol::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--neon); cursor: pointer; }
    .vol:disabled { opacity: 0.4; }
    .status { font-size: 13px; color: #7d93b3; min-height: 18px; }
    #yt-host { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">♪ NEON MUSIC</div>
    <div class="station"><span class="dot" id="dot"></span><span id="station">NEON MUSIC</span></div>
    <div class="vinyl" id="vinyl"><img id="cover" alt="" /></div>
    <div class="title" id="song-title">NEON MUSIC</div>
    <div class="artist" id="song-artist"></div>
    <div class="controls">
      <button class="play" id="btn-play" disabled>▶</button>
      <div class="vol-wrap">
        <span class="vol-icon">🔊</span>
        <input class="vol" id="volume" type="range" min="0" max="100" value="80" disabled />
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <audio id="audio" preload="auto"></audio>
  <div id="yt-host"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/listener.js"></script>
</body>
</html>
