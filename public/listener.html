<audio id="audio" crossorigin="anonymous" preload="none"></audio>
<script>
const audioEl=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const statusEl=document.getElementById('status');
const dotEl=document.getElementById('dot');
let stallTimer=null, isPlaying=false;

function playStream(){
  audioEl.src='/radio/stream?_t='+Date.now();
  audioEl.load();
  audioEl.play().then(()=>{
    isPlaying=true; playBtn.textContent='⏸ PAUSAR RADIO';
    dotEl.className='dot on'; statusEl.textContent='Transmitiendo en vivo';
  }).catch(()=>{
    statusEl.textContent='Toca ▶ para sintonizar';
    scheduleReconnect();
  });
}
function scheduleReconnect(){
  clearTimeout(stallTimer);
  stallTimer=setTimeout(()=>{
    statusEl.textContent='Reconectando señal...';
    // fuerza nueva petición para salir del 404 cacheado
    try{audioEl.pause()}catch{}
    audioEl.removeAttribute('src'); audioEl.load();
    setTimeout(playStream,300);
  },3000);
}
playBtn.addEventListener('click',()=>{
  if(isPlaying){ try{audioEl.pause()}catch{}; isPlaying=false; playBtn.textContent='▶ REPRODUCIR RADIO'; dotEl.className='dot off'; statusEl.textContent='Radio pausada'; clearTimeout(stallTimer); }
  else playStream();
});
audioEl.addEventListener('stalled',scheduleReconnect);
audioEl.addEventListener('waiting',scheduleReconnect);
audioEl.addEventListener('error',scheduleReconnect);
audioEl.addEventListener('playing',()=>{ clearTimeout(stallTimer); dotEl.className='dot on'; statusEl.textContent='Transmitiendo en vivo'; });
</script>
