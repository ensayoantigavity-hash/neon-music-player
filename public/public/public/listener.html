<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NEON MUSIC · Escucha</title>
<style>
  :root{--neon:#19e3ff;--neon2:#ff2bd6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 800px at 50% -10%,#16213a 0%,#0a0e1a 55%,#05070f 100%);color:#eaf2ff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100%;padding:20px;text-align:center}
  .card{width:min(520px,92vw);padding:28px 22px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(25,227,255,.25);box-shadow:0 0 40px rgba(25,227,255,.12);backdrop-filter:blur(6px)}
  .logo{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .station{font-size:13px;color:#9fb6d4;letter-spacing:2px;margin:10px 0 18px}
  .vinyl{width:190px;height:190px;border-radius:50%;margin:0 auto 16px;background:#0c1322;border:3px solid rgba(25,227,255,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .vinyl.playing{animation:spin 7s linear infinite}
  .vinyl img{width:100%;height:100%;object-fit:cover;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{font-size:20px;font-weight:700;margin:0 0 4px}
  .artist{font-size:14px;color:#9fb6d4;margin:0 0 18px}
  .play{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:24px;color:#04121c;background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 24px rgba(25,227,255,.45)}
  .status{font-size:13px;color:#7d93b3;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">♪ NEON MUSIC</div>
  <div class="station" id="station">NEON MUSIC · EN VIVO</div>
  <div class="vinyl" id="vinyl"><img id="cover" alt=""></div>
  <div class="title" id="song-title">Sintoniza la radio</div>
  <div class="artist" id="song-artist"></div>
  <button class="play" id="btn-play">▶</button>
  <div class="status" id="status">Listo para sintonizar</div>
</div>

<!-- 1. ESTRUCTURA REPRODUCTOR -->
<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script>
// 2. CÓDIGO DE CONEXIÓN
const audioEl = document.getElementById('audio');
const btnPlay = document.getElementById('btn-play');
const statusEl = document.getElementById('status');
const vinyl = document.getElementById('vinyl');
let stallTimer = null;
let isPlaying = false;

function playRadio(){
  audioEl.src = '/radio/stream';
  audioEl.load();
  audioEl.play().then(()=>{
    isPlaying = true;
    btnPlay.textContent = '⏸';
    vinyl.classList.add('playing');
    statusEl.textContent = '';
  }).catch(()=>{
    statusEl.textContent = 'Toca ▶ para sintonizar';
  });
}
function pauseRadio(){
  try{ audioEl.pause(); }catch{}
  isPlaying = false;
  btnPlay.textContent = '▶';
  vinyl.classList.remove('playing');
}

// Botón Play/Pausa vinculado al <audio>
btnPlay.addEventListener('click', ()=>{
  if(isPlaying){ pauseRadio(); }
  else { playRadio(); }
});

// Anti-congelamiento: si se corta >3s, reengancha solo
function scheduleReconnect(){
  clearTimeout(stallTimer);
  stallTimer = setTimeout(()=>{
    statusEl.textContent = 'Reconectando...';
    audioEl.load();
    audioEl.play().catch(()=>{});
  }, 3000);
}
audioEl.addEventListener('stalled', scheduleReconnect);
audioEl.addEventListener('waiting', scheduleReconnect);
audioEl.addEventListener('error', scheduleReconnect);
audioEl.addEventListener('playing', ()=>{ clearTimeout(stallTimer); statusEl.textContent=''; vinyl.classList.add('playing'); });
audioEl.addEventListener('pause', ()=>{ clearTimeout(stallTimer); });
audioEl.addEventListener('canplay', ()=> clearTimeout(stallTimer));
</script>
</body>
</html>
