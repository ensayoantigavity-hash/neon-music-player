<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEON MUSIC · Mini</title>
<style>
  :root { --neon: #19e3ff; --neon2: #ff2bd6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #16213a 0%, #0a0e1a 55%, #05070f 100%);
    color: #eaf2ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 20px; text-align: center;
  }
  .card {
    width: min(360px, 92vw); padding: 26px 20px; border-radius: 20px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(25,227,255,0.25);
    box-shadow: 0 0 40px rgba(25,227,255,0.12); backdrop-filter: blur(6px);
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; margin-bottom: 2px;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .station { font-size: 11px; color: #9fb6d4; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #44506a; }
  .dot.on { background: #25e08a; box-shadow: 0 0 10px rgba(37,224,138,0.8); }
  .dot.off { background: #ff5d5d; box-shadow: 0 0 10px rgba(255,93,93,0.8); }
  .title { font-size: 16px; font-weight: 700; line-height: 1.3; margin: 0 0 18px; min-height: 20px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .play {
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer; font-size: 22px;
    color: #04121c; background: linear-gradient(90deg, var(--neon), var(--neon2));
    box-shadow: 0 0 24px rgba(25,227,255,0.45);
  }
  .play:active { transform: scale(0.95); }
  .vol-wrap { display: flex; align-items: center; gap: 8px; }
  .vol-icon { font-size: 17px; }
  .vol { width: 120px; height: 6px; border-radius: 6px; -webkit-appearance: none; appearance: none; outline: none; cursor: pointer;
    background: linear-gradient(90deg, var(--neon) var(--pct, 80%), #2a3550 var(--pct, 80%)); }
  .vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--neon); box-shadow: 0 0 8px var(--neon); cursor: pointer; }
  .status { font-size: 12px; color: #7d93b3; min-height: 16px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">♪ NEON MUSIC · MINI</div>
    <div class="station"><span id="dot" class="dot off"></span><span>En vivo</span></div>
    <div class="title" id="song-title">Sintonizando…</div>
    <div class="controls">
      <button id="btn-play" class="play">▶</button>
      <div class="vol-wrap">
        <span class="vol-icon">🔊</span>
        <input id="volume" class="vol" type="range" min="0" max="100" value="80" />
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <audio id="audio" preload="none" playsinline></audio>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const audio = $('#audio'), btn = $('#btn-play'), vol = $('#volume');
  const dot = $('#dot'), statusEl = $('#status'), titleEl = $('#song-title');

  let stallTimer = null, playing = false, pausedByUser = false;

  const setStatus = (m) => { statusEl.textContent = m || ''; };
  const setDot = (on) => { dot.className = 'dot ' + (on ? 'on' : 'off'); };

  function conectar() {
    try { audio.pause(); } catch (e) {}
    audio.src = '/radio/stream?_t=' + Date.now();
    audio.load();
    setStatus('Sintonizando...');
    audio.play().then(() => {
      playing = true; btn.textContent = '⏸'; setDot(true); setStatus('En vivo');
    }).catch(() => { setStatus('Toca ▶ para escuchar'); programarReconexion(); });
  }

  function programarReconexion() {
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => {
      if (pausedByUser) return;
      setStatus('Reconectando...');
      try { audio.pause(); } catch (e) {}
      audio.removeAttribute('src'); audio.load();
      setTimeout(conectar, 300);
    }, 3000);
  }

  btn.addEventListener('click', () => {
    if (playing) {
      pausedByUser = true;
      try { audio.pause(); } catch (e) {}
      playing = false; btn.textContent = '▶'; setDot(false);
      clearTimeout(stallTimer); setStatus('Pausado');
    } else {
      pausedByUser = false; conectar();
    }
  });

  audio.addEventListener('stalled', () => { setStatus('Señal débil...'); programarReconexion(); });
  audio.addEventListener('waiting', () => { setStatus('Buffering...'); programarReconexion(); });
  audio.addEventListener('error', programarReconexion);
  audio.addEventListener('playing', () => {
    clearTimeout(stallTimer); playing = true;
    btn.textContent = '⏸'; setDot(true); setStatus('En vivo');
  });
  audio.addEventListener('pause', () => { if (!pausedByUser) programarReconexion(); });

  vol.addEventListener('input', () => {
    audio.volume = (parseInt(vol.value, 10) || 0) / 100;
    vol.style.setProperty('--pct', vol.value + '%');
  });
  audio.volume = 0.8;

  // Metadatos de lo que suena (solo lectura)
  setInterval(async () => {
    try {
      const r = await fetch('/api/nowplaying', { cache: 'no-store' });
      const d = await r.json();
      if (d && d.id && d.title) titleEl.textContent = d.title;
      else titleEl.textContent = 'NEON MUSIC';
    } catch (e) {}
  }, 4000);

  // Arranque automatico + segundo intento temprano
  conectar();
  setTimeout(conectar, 700);
})();
</script>
</body>
</html>
